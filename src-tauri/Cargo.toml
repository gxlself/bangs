[package]
name = "bangs"
version = "0.2.5"
description = "A dynamic notch for macOS and Windows"
authors = ["gxlself"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bangs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-drag = "2"
tauri-plugin-clipboard-manager = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# native-tls keeps this on the OS trust store (Security.framework, schannel)
# and off a bundled C crypto library.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "charset", "native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Reads the Paste app's Core Data store read-only.
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
# The `implement` macro expands to paths in this crate.
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
