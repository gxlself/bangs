# XcodeGen spec: `cd ios && xcodegen generate` writes Bangs.xcodeproj (git-ignored).
# Info.plist is generated from `info:` below, into Bangs/Info.plist (also git-ignored).
name: Bangs

options:
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"
  createIntermediateGroups: true

# Project-level settings. Bangs.xcconfig (target level, below) is applied on top of these,
# so a Local.xcconfig can override the team and the bundle id.
settings:
  base:
    DEVELOPMENT_TEAM: W8L8ZJ3N2P
    PRODUCT_BUNDLE_IDENTIFIER: com.gxlself.bangs.ios
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  BangsCloud:
    path: ../packages/BangsCloud

targets:
  Bangs:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Bangs
    dependencies:
      - package: BangsCloud
        product: BangsCloud
      - package: BangsCloud
        product: BangsSyncCore
      # The Apple Watch app ships inside the iPhone app (Embed Watch Content).
      - target: BangsWatch
    configFiles:
      Debug: Bangs.xcconfig
      Release: Bangs.xcconfig
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Bangs/Bangs.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.Push:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
    info:
      path: Bangs/Info.plist
      properties:
        CFBundleDisplayName: Bangs
        # The app speaks Chinese and English (t() in I18n.swift); saying so here makes the
        # system's own words follow — Cancel, Done, edit menus, CloudKit's messages — and
        # gives the app its own Language setting.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        # XcodeGen writes 1.0 / 1 here unless told otherwise; follow the build settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

  # The Apple Watch app (sources in ../watch; its Info.plist is generated from `info:` below,
  # into watch/Info.plist, git-ignored). It talks to Bangs on the Mac over the local
  # network, not to this iPhone app, so it runs on its own once installed; see watch/README.md.
  # Its bundle id has to start with the iPhone app's: change both together.
  BangsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../watch/BangsWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gxlself.bangs.ios.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: ../watch/Info.plist
      properties:
        CFBundleDisplayName: Bangs
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.gxlself.bangs.ios
        WKRunsIndependentlyOfCompanionApp: true
        # Bangs answers on the local network over plain HTTP (src-tauri/src/remote.rs);
        # everything else stays under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The Chinese is in BangsWatch/zh-Hans.lproj/InfoPlist.strings.
        NSLocalNetworkUsageDescription: Bangs connects to Bangs on your Mac over the local network.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false

schemes:
  Bangs:
    build:
      targets:
        Bangs: all
    run:
      config: Debug
    archive:
      config: Release
  BangsWatch:
    build:
      targets:
        BangsWatch: all
    run:
      config: Debug
